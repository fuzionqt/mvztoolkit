name: Build Custom PvZ Toolkit

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSBuild & MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Download & Install FLTK and zlib
      run: |
        # Download pre-built/static structures needed for PvZ Toolkit
        mkdir C:\Dev
        Invoke-WebRequest -Uri "https://github.com" -OutFile C:\Dev\instructions.md
        # Note: The codebase looks for FLTK_DIR inside standard static folders. 
        # For a rapid cloud bypass, we force CMake to download the requirements directly:
        
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x86 -DCMAKE_BUILD_TYPE=MinSizeRel ..

    - name: Build Project
      run: |
        cmake --build build --config MinSizeRel

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: Custom-PvZ-Toolkit
        path: build/MinSizeRel/*.exe
