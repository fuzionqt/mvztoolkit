name: Build PvZ Toolkit for Mod

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC x86 Environment
      uses: microsoft/setup-msbuild@v2

    - name: Install vcpkg Dependencies
      run: |
        vcpkg install fltk:x86-windows zlib:x86-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A Win32 -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ..

    - name: Compile Application
      run: |
        cmake --build build --config Release

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-PvZ-Toolkit
        path: build/Release/*.exe
